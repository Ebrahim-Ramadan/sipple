<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sipple • Hydration Tracker</title>
    <style>
      :root {
        --goal-ml: 2500;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 20% 20%, #d7efff 0, #bde3ff 30%, #85c7ff 100%);
        color: #073153;
      }

      .app {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(430px, 100%);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(8px);
        border-radius: 26px;
        padding: 28px 24px 84px;
        position: relative;
        box-shadow: 0 20px 45px rgba(7, 49, 83, 0.2);
        text-align: center;
      }

      h1 {
        margin: 0 0 6px;
      }

      .subtitle {
        margin: 0 0 18px;
        color: #2f628a;
      }

      .goal {
        margin: 0 0 18px;
        font-weight: 700;
      }

      .body-wrap {
        display: grid;
        place-items: center;
      }

      .body-meter {
        width: 200px;
        height: 360px;
        border: 4px solid #0f5d95;
        border-radius: 90px 90px 70px 70px;
        background: #f2f9ff;
        position: relative;
        overflow: hidden;
      }

      .water {
        position: absolute;
        inset: auto 0 0 0;
        height: 0%;
        background: linear-gradient(180deg, #2f9fff 0%, #1281f5 100%);
        transition: height 0.45s ease;
      }

      .water::before {
        content: "";
        position: absolute;
        top: -12px;
        left: -10%;
        right: -10%;
        height: 22px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 50%;
      }

      .progress {
        margin-top: 14px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .add-btn {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: #0f8dff;
        color: white;
        font-size: 2rem;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(15, 141, 255, 0.35);
      }

      .modal {
        position: fixed;
        inset: 0;
        display: none;
        place-items: end center;
        background: rgba(3, 24, 40, 0.35);
        padding: 20px;
      }

      .modal[open] {
        display: grid;
      }

      .sheet {
        width: min(430px, 100%);
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(3, 24, 40, 0.28);
      }

      .litres {
        margin: 8px 0 14px;
        font-size: 1.5rem;
        font-weight: 800;
      }

      input[type="range"] {
        width: 100%;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
      }

      .actions button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 11px 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cancel {
        background: #e9f3fb;
        color: #0f5d95;
      }

      .confirm {
        background: #0f8dff;
        color: white;
      }

      .celebrate {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .emoji {
        position: absolute;
        top: -50px;
        font-size: 1.6rem;
        animation: drop 1.9s linear forwards;
      }

      @keyframes drop {
        to {
          transform: translateY(calc(100vh + 60px)) rotate(360deg);
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card" aria-label="Hydration tracker">
        <h1>💧 Sipple</h1>
        <p class="subtitle">Keep your body happy and hydrated.</p>
        <p class="goal" id="goalText">Goal: 2500 ml</p>
        <div class="body-wrap">
          <div class="body-meter">
            <div class="water" id="water"></div>
          </div>
          <p class="progress" id="progressText">0 / 2500 ml</p>
        </div>
        <button class="add-btn" id="openAdd" aria-label="Add water">+</button>
      </section>
    </main>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="sheet">
        <h2 style="margin: 0">Add Water</h2>
        <p style="margin: 8px 0 0; color: #2f628a">Choose litres to drink</p>
        <p class="litres"><span id="litresValue">0.5</span> L</p>
        <input id="litresSlider" type="range" min="0.1" max="1.5" step="0.1" value="0.5" />
        <div class="actions">
          <button class="cancel" id="cancel">Cancel</button>
          <button class="confirm" id="confirm">Add</button>
        </div>
      </div>
    </div>

    <div class="celebrate" id="celebrate"></div>

    <script>
      const GOAL_ML = 2500;
      let consumedMl = 0;
      let celebrated = false;

      const waterEl = document.getElementById("water");
      const progressTextEl = document.getElementById("progressText");
      const goalTextEl = document.getElementById("goalText");
      const modalEl = document.getElementById("modal");
      const sliderEl = document.getElementById("litresSlider");
      const litresValueEl = document.getElementById("litresValue");
      const celebrateEl = document.getElementById("celebrate");

      function render() {
        const ratio = Math.min(consumedMl / GOAL_ML, 1);
        waterEl.style.height = `${ratio * 100}%`;
        progressTextEl.textContent = `${consumedMl} / ${GOAL_ML} ml`;
        goalTextEl.textContent = `Goal: ${GOAL_ML} ml`;

        if (consumedMl >= GOAL_ML && !celebrated) {
          celebrated = true;
          launchCelebration();
        } else if (consumedMl < GOAL_ML) {
          celebrated = false;
        }
      }

      function setModalOpen(isOpen) {
        if (isOpen) {
          modalEl.setAttribute("open", "");
          modalEl.setAttribute("aria-hidden", "false");
        } else {
          modalEl.removeAttribute("open");
          modalEl.setAttribute("aria-hidden", "true");
        }
      }

      function launchCelebration() {
        const icons = ["🎉", "💧", "✨", "🥳"];
        for (let i = 0; i < 24; i += 1) {
          const span = document.createElement("span");
          span.className = "emoji";
          span.textContent = icons[i % icons.length];
          span.style.left = `${Math.random() * 100}%`;
          span.style.animationDelay = `${Math.random() * 0.35}s`;
          celebrateEl.appendChild(span);
          setTimeout(() => span.remove(), 2400);
        }
      }

      document.getElementById("openAdd").addEventListener("click", () => setModalOpen(true));
      document.getElementById("cancel").addEventListener("click", () => setModalOpen(false));

      sliderEl.addEventListener("input", (e) => {
        litresValueEl.textContent = Number(e.target.value).toFixed(1);
      });

      document.getElementById("confirm").addEventListener("click", () => {
        const addMl = Math.round(Number(sliderEl.value) * 1000);
        consumedMl += addMl;
        setModalOpen(false);
        render();
      });

      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) {
          setModalOpen(false);
        }
      });

      render();
    </script>
  </body>
</html>
